<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seating Chart Planner</title>
<style>
:root{--bg:#faf7f4;--panel:#fff;--ink:#2d2a2e;--mute:#8a8490;--line:#e7e0e0;--accent:#b5838d;--accent2:#6d6875;--ok:#7a9e7e;--warn:#d98e73}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:20px;margin:0 auto 0 0;font-weight:normal;letter-spacing:.5px}
header h1 small{color:var(--mute);font-size:13px;margin-left:8px}
.btn{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-family:system-ui,sans-serif}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{flex:1;display:flex;min-height:0}
aside{width:310px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;font-family:system-ui,sans-serif;font-size:13px}
.stats{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.stat{flex:1;text-align:center;background:var(--bg);border-radius:6px;padding:6px 2px}
.stat b{display:block;font-size:18px}
.stat span{color:var(--mute);font-size:11px}
.tools{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px}
.tools input,.tools select,.tools textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
#guestList{flex:1;overflow:auto;padding:6px 10px}
.guest{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin:4px 0;background:#fff;cursor:grab}
.guest.sel{outline:2px solid var(--accent)}
.guest .n{flex:1;min-width:0}
.guest .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guest .n small{color:var(--mute)}
.guest .at{font-size:11px;color:var(--ok)}
.guest .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
#stage{flex:1;position:relative;overflow:auto;background-image:radial-gradient(#e9e2e2 1px,transparent 1px);background-size:24px 24px}
#floor{position:relative;width:2400px;height:1600px}
.table{position:absolute;user-select:none}
.tbody{position:absolute;background:#fff;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;text-align:center;cursor:move;font-size:13px;line-height:1.2;touch-action:none;box-shadow:0 2px 8px #0001}
.tbody.round{border-radius:50%}
.tbody.rect{border-radius:8px}
.tbody.over{border-color:var(--warn)}
.tbody input{width:84%;border:0;text-align:center;background:transparent;font:inherit;font-weight:bold;cursor:text}
.tbody .cnt{display:block;font-size:11px;color:var(--mute);font-family:system-ui,sans-serif;font-weight:normal}
.tctl{position:absolute;top:-72px;left:50%;transform:translateX(-50%);display:none;gap:3px;white-space:nowrap;z-index:5}
.table:hover .tctl{display:flex}
.tctl button{border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;padding:1px 6px;font-size:12px}
.seat{position:absolute;width:38px;height:38px;border-radius:50%;border:2px dashed #cdbfc3;background:#fff8;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:system-ui,sans-serif;color:var(--mute);cursor:pointer;overflow:hidden}
.seat.full{border:2px solid var(--accent2);color:#fff;font-weight:600;cursor:grab}
.seat.hot{outline:3px solid var(--accent)}
#hint{position:absolute;left:16px;top:12px;font:12px system-ui;color:var(--mute);pointer-events:none}
dialog{border:1px solid var(--line);border-radius:10px;font-family:system-ui,sans-serif;max-width:480px;width:92%}
dialog textarea{width:100%;height:160px}
#printArea{display:none}
@media print{
 body{display:block;height:auto;background:#fff}
 header,main{display:none}
 #printArea{display:block;font-family:Georgia,serif;padding:10px}
 #printArea h2{text-align:center;font-weight:normal}
 .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
 .pcard{border:1px solid #999;border-radius:8px;padding:10px;break-inside:avoid}
 .pcard h3{margin:0 0 6px;font-size:15px}
 .pcard ol{margin:0;padding-left:20px;font-size:13px}
}
@media(max-width:760px){main{flex-direction:column}aside{width:100%;height:42vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Seating Chart Planner <small id="evName"></small></h1>
  <button class="btn" id="addRound">+ Round table</button>
  <button class="btn" id="addRect">+ Long table</button>
  <button class="btn" id="autoBtn">Auto-seat</button>
  <button class="btn" id="csvBtn">Export CSV</button>
  <button class="btn" id="saveBtn">Save file</button>
  <button class="btn" id="loadBtn">Open file</button>
  <button class="btn primary" id="printBtn">Print</button>
  <input type="file" id="fileIn" accept=".json" hidden>
</header>
<main>
<aside>
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Guests</span></div>
    <div class="stat"><b id="sSeated">0</b><span>Seated</span></div>
    <div class="stat"><b id="sLeft">0</b><span>Unseated</span></div>
    <div class="stat"><b id="sSeats">0</b><span>Seats</span></div>
  </div>
  <div class="tools">
    <div class="row"><input id="gName" placeholder="Guest name"><button class="btn primary" id="gAdd">Add</button></div>
    <div class="row">
      <input id="gGroup" placeholder="Group (e.g. Bride's family)" list="groups">
      <select id="gMeal"><option value="">Meal</option><option>Chicken</option><option>Beef</option><option>Fish</option><option>Vegetarian</option><option>Vegan</option><option>Kids</option></select>
    </div>
    <datalist id="groups"></datalist>
    <div class="row"><button class="btn" id="bulkBtn">Paste list…</button><select id="filter"><option value="all">All guests</option><option value="un" selected>Unseated only</option><option value="seated">Seated only</option></select></div>
    <input id="search" placeholder="Search guests…">
  </div>
  <div id="guestList"></div>
</aside>
<section id="stage"><div id="hint">Drag guests onto seats · or click a guest, then click a seat · drag tables to arrange</div><div id="floor"></div></section>
</main>
<div id="printArea"></div>

<dialog id="bulkDlg">
  <form method="dialog">
    <h3>Paste guest list</h3>
    <p style="color:#8a8490;font-size:13px">One guest per line. Optional: <code>Name, Group, Meal</code></p>
    <textarea id="bulkTxt" placeholder="Jane Smith, Bride's family, Chicken&#10;Tom Lee, Friends"></textarea>
    <div style="margin-top:10px;display:flex;gap:6px;justify-content:flex-end">
      <button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok" id="bulkOk">Import</button>
    </div>
  </form>
</dialog>

<script>
(()=>{
const KEY='seatplan.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const PALETTE=['#b5838d','#6d6875','#7a9e7e','#d98e73','#5f7a9e','#a08fb5','#c9a227','#4e8f8c'];
let S=load()||{event:'',guests:[],tables:[
  {id:uid(),name:'Table 1',shape:'round',seats:8,x:120,y:120},
  {id:uid(),name:'Table 2',shape:'round',seats:8,x:420,y:120}]};
let selected=null, drag=null;

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const gById=id=>S.guests.find(g=>g.id===id);
const groups=()=>[...new Set(S.guests.map(g=>g.group).filter(Boolean))];
const gColor=g=>g.group?PALETTE[groups().indexOf(g.group)%PALETTE.length]:'#9a9aa3';
const initials=n=>n.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
const occupant=(t,i)=>S.guests.find(g=>g.table===t.id&&g.seat===i);

function assign(gid,tid,idx){
  const g=gById(gid); if(!g)return;
  const other=occupant(S.tables.find(t=>t.id===tid),idx);
  const prev={table:g.table,seat:g.seat};
  if(other&&other!==g){other.table=prev.table;other.seat=prev.seat;}
  g.table=tid;g.seat=idx;
}
function unseat(g){g.table=null;g.seat=null}

/* ---------- render ---------- */
function render(){
  $('#evName').textContent=S.event;
  // stats
  const seated=S.guests.filter(g=>g.table).length;
  $('#sTotal').textContent=S.guests.length;
  $('#sSeated').textContent=seated;
  $('#sLeft').textContent=S.guests.length-seated;
  $('#sSeats').textContent=S.tables.reduce((a,t)=>a+t.seats,0);
  $('#groups').innerHTML=groups().map(g=>`<option value="${esc(g)}">`).join('');
  renderGuests(); renderFloor(); save();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderGuests(){
  const q=$('#search').value.toLowerCase(), f=$('#filter').value;
  const list=S.guests.filter(g=>(f==='all'||(f==='un')===!g.table)&&(g.name+' '+g.group).toLowerCase().includes(q))
    .sort((a,b)=>(a.group||'').localeCompare(b.group||'')||a.name.localeCompare(b.name));
  $('#guestList').innerHTML=list.map(g=>{
    const t=S.tables.find(t=>t.id===g.table);
    return `<div class="guest ${selected===g.id?'sel':''}" draggable="true" data-g="${g.id}">
      <span class="dot" style="background:${gColor(g)}"></span>
      <div class="n"><div>${esc(g.name)}</div><small>${esc([g.group,g.meal].filter(Boolean).join(' · '))}</small></div>
      ${t?`<span class="at">${esc(t.name)}</span>`:''}
      <button class="x" data-del="${g.id}" title="Remove">×</button></div>`}).join('')
    ||'<p style="color:#8a8490;text-align:center;margin-top:30px">No guests here.</p>';
}

function seatPositions(t){
  const out=[];
  if(t.shape==='round'){
    const r=60+Math.max(0,t.seats-8)*4; // table radius
    const R=r+28;
    for(let i=0;i<t.seats;i++){const a=2*Math.PI*i/t.seats-Math.PI/2;out.push([Math.cos(a)*R,Math.sin(a)*R])}
    return {w:r*2,h:r*2,pos:out};
  }
  const per=Math.ceil(t.seats/2), w=Math.max(120,per*46), h=70;
  for(let i=0;i<t.seats;i++){
    const top=i<per, k=top?i:i-per, n=top?per:t.seats-per;
    const x=(k+.5)*(w/n)-w/2; out.push([x,top?-(h/2+28):(h/2+28)]);
  }
  return {w,h,pos:out};
}

function renderFloor(){
  const floor=$('#floor');
  floor.innerHTML=S.tables.map(t=>{
    const {w,h,pos}=seatPositions(t);
    const used=S.guests.filter(g=>g.table===t.id).length;
    const seats=pos.map(([x,y],i)=>{
      const g=occupant(t,i);
      return `<div class="seat ${g?'full':''}" data-t="${t.id}" data-i="${i}" ${g?`draggable="true" data-g="${g.id}" title="${esc(g.name)}" style="left:${w/2+x-19}px;top:${h/2+y-19}px;background:${gColor(g)}">${esc(initials(g.name))}`
        :`style="left:${w/2+x-19}px;top:${h/2+y-19}px" title="Seat ${i+1}">${i+1}`}</div>`}).join('');
    return `<div class="table" data-tb="${t.id}" style="left:${t.x}px;top:${t.y}px;width:${w}px;height:${h}px">
      <div class="tctl"><button data-act="minus" title="Remove a seat">− seat</button><button data-act="plus" title="Add a seat">+ seat</button><button data-act="clear">Clear</button><button data-act="del">Delete</button></div>
      <div class="tbody ${t.shape} ${used>t.seats?'over':''}" style="width:${w}px;height:${h}px" data-handle="${t.id}">
        <div><input value="${esc(t.name)}" data-rename="${t.id}"><span class="cnt">${used}/${t.seats} seated</span></div></div>
      ${seats}</div>`}).join('');
}

/* ---------- events ---------- */
document.addEventListener('dragstart',e=>{
  const el=e.target.closest('[data-g]'); if(!el)return;
  e.dataTransfer.setData('text/plain',el.dataset.g); e.dataTransfer.effectAllowed='move';
});
const stage=$('#stage');
stage.addEventListener('dragover',e=>{if(e.target.closest('.seat')){e.preventDefault();}});
stage.addEventListener('drop',e=>{
  const s=e.target.closest('.seat'); if(!s)return; e.preventDefault();
  assign(e.dataTransfer.getData('text/plain'),s.dataset.t,+s.dataset.i); render();
});
$('#guestList').addEventListener('dragover',e=>e.preventDefault());
$('#guestList').addEventListener('drop',e=>{ // drop seated guest back to list = unseat
  e.preventDefault(); const g=gById(e.dataTransfer.getData('text/plain')); if(g){unseat(g);render();}
});
$('#guestList').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');
  if(d){const g=gById(d.dataset.del); if(g&&confirm(`Remove ${g.name}?`)){S.guests=S.guests.filter(x=>x!==g);render();} return;}
  const el=e.target.closest('[data-g]'); if(el){selected=selected===el.dataset.g?null:el.dataset.g;renderGuests();}
});
stage.addEventListener('click',e=>{
  const s=e.target.closest('.seat');
  if(s){
    const t=S.tables.find(t=>t.id===s.dataset.t), i=+s.dataset.i, g=occupant(t,i);
    if(selected){assign(selected,t.id,i);selected=null;render();}
    else if(g){selected=g.id;renderGuests();}
    return;
  }
  const b=e.target.closest('[data-act]');
  if(b){
    const t=S.tables.find(t=>t.id===b.closest('.table').dataset.tb), a=b.dataset.act;
    if(a==='plus')t.seats=Math.min(t.seats+1,24);
    if(a==='minus'){ if(t.seats>1){const o=occupant(t,t.seats-1); if(o)unseat(o); t.seats--;} }
    if(a==='clear')S.guests.forEach(g=>{if(g.table===t.id)unseat(g)});
    if(a==='del'){ if(!confirm(`Delete ${t.name}? Its guests become unseated.`))return;
      S.guests.forEach(g=>{if(g.table===t.id)unseat(g)}); S.tables=S.tables.filter(x=>x!==t);}
    render();
  }
});
stage.addEventListener('change',e=>{
  const r=e.target.closest('[data-rename]'); if(r){S.tables.find(t=>t.id===r.dataset.rename).name=r.value||'Table';render();}
});
// move tables with pointer
stage.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-handle]'); if(!h||e.target.tagName==='INPUT')return;
  const t=S.tables.find(t=>t.id===h.dataset.handle);
  drag={t,el:h.closest('.table'),sx:e.clientX,sy:e.clientY,ox:t.x,oy:t.y};
  h.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  drag.t.x=Math.max(40,Math.round((drag.ox+e.clientX-drag.sx)/12)*12);
  drag.t.y=Math.max(40,Math.round((drag.oy+e.clientY-drag.sy)/12)*12);
  drag.el.style.left=drag.t.x+'px';drag.el.style.top=drag.t.y+'px';
});
stage.addEventListener('pointerup',()=>{if(drag){drag=null;save();}});

function addGuest(name,group,meal){name=name.trim();if(!name)return;S.guests.push({id:uid(),name,group:(group||'').trim(),meal:meal||'',table:null,seat:null});}
$('#gAdd').onclick=()=>{addGuest($('#gName').value,$('#gGroup').value,$('#gMeal').value);$('#gName').value='';$('#gName').focus();render();};
$('#gName').onkeydown=e=>{if(e.key==='Enter')$('#gAdd').click()};
$('#search').oninput=renderGuests; $('#filter').onchange=renderGuests;
$('#bulkBtn').onclick=()=>$('#bulkDlg').showModal();
$('#bulkOk').onclick=()=>{
  $('#bulkTxt').value.split('\n').forEach(l=>{const [n,g,m]=l.split(',').map(s=>s.trim());if(n)addGuest(n,g,m)});
  $('#bulkTxt').value='';render();
};
function addTable(shape){
  const n=S.tables.length+1, last=S.tables[S.tables.length-1];
  S.tables.push({id:uid(),name:'Table '+n,shape,seats:shape==='round'?8:10,
    x:last?(last.x+300>2000?120:last.x+300):120,y:last?(last.x+300>2000?last.y+300:last.y):120});render();
}
$('#addRound').onclick=()=>addTable('round');
$('#addRect').onclick=()=>addTable('rect');

// Auto-seat: fill tables in order, keeping groups together
$('#autoBtn').onclick=()=>{
  const un=S.guests.filter(g=>!g.table).sort((a,b)=>(a.group||'~').localeCompare(b.group||'~'));
  if(!un.length){alert('Everyone is already seated.');return;}
  let placed=0;
  for(const g of un){
    outer: for(const t of S.tables){for(let i=0;i<t.seats;i++){if(!occupant(t,i)){g.table=t.id;g.seat=i;placed++;break outer;}}}
  }
  render(); if(placed<un.length)alert(`${un.length-placed} guest(s) didn't fit — add more tables or seats.`);
};

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('#csvBtn').onclick=()=>{
  const q=v=>`"${String(v||'').replace(/"/g,'""')}"`;
  const rows=[['Name','Group','Meal','Table','Seat']].concat(S.guests.map(g=>{const t=S.tables.find(t=>t.id===g.table);return [g.name,g.group,g.meal,t?t.name:'',g.seat!=null?g.seat+1:'']}));
  download('seating-chart.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
};
$('#saveBtn').onclick=()=>download('seating-plan.json',JSON.stringify(S,null,1),'application/json');
$('#loadBtn').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.guests)||!Array.isArray(d.tables))throw 0;S=d;render();}catch(_){alert('That file is not a valid seating plan.')}});
  e.target.value='';
};
$('#evName').onclick=()=>{const n=prompt('Event name',S.event);if(n!==null){S.event=n;render();}};
$('#evName').style.cursor='pointer'; $('#evName').title='Click to set event name';
$('#printBtn').onclick=()=>{
  $('#printArea').innerHTML=`<h2>${esc(S.event||'Seating Chart')}</h2><div class="pgrid">`+S.tables.map(t=>{
    const gs=S.guests.filter(g=>g.table===t.id).sort((a,b)=>a.seat-b.seat);
    return `<div class="pcard"><h3>${esc(t.name)}</h3><ol>${gs.map(g=>`<li>${esc(g.name)}${g.meal?` <small>(${esc(g.meal)})</small>`:''}</li>`).join('')||'<li style="list-style:none;color:#999">—</li>'}</ol></div>`}).join('')+'</div>'
    +`<h3 style="margin-top:20px">Alphabetical finder</h3><div style="columns:3;font-size:13px">`+
    [...S.guests].filter(g=>g.table).sort((a,b)=>a.name.localeCompare(b.name)).map(g=>`${esc(g.name)} — ${esc(S.tables.find(t=>t.id===g.table).name)}<br>`).join('')+'</div>';
  window.print();
};
render();
})();
</script>
</body>
</html>
